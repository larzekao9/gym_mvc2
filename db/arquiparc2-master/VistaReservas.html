<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas de Hotel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: sans-serif; background: #f5f5f5; color: #333; }

        /* ── Header ──────────────────────────────────────────────────────────── */
        header {
            background: #1a365d;
            color: #fff;
            padding: 1rem 2rem;
        }
        header h1 { font-size: 1.3rem; }
        header p  { font-size: .8rem; opacity: .75; margin-top: .2rem; }

        .nav-link {
            display: inline-block;
            margin-top: .5rem;
            color: #a0b8d8;
            font-size: .85rem;
            text-decoration: none;
        }
        .nav-link:hover { color: #fff; text-decoration: underline; }

        /* ── Main grid ───────────────────────────────────────────────────────── */
        main {
            max-width: 1100px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 1.2rem;
        }

        section {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 1.2rem;
        }

        h2 {
            font-size: .95rem;
            color: #1a365d;
            margin-bottom: .9rem;
            padding-bottom: .4rem;
            border-bottom: 1px solid #ddd;
        }

        /* ── Habitaciones ────────────────────────────────────────────────────── */
        #r-grid-habitaciones {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: .6rem;
        }
        .hab-card {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: .6rem;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: .2rem;
        }
        .hab-card:hover        { border-color: #2b6cb0; background: #f0f6ff; }
        .hab-card.seleccionada { border-color: #1a365d; background: #dbe9ff; }
        .hab-card.no-disponible { opacity: .45; cursor: not-allowed; }
        .hab-num    { font-size: 1.2rem; font-weight: 700; }
        .hab-tipo   { font-size: .7rem; text-transform: uppercase; color: #666; }
        .hab-precio { font-size: .75rem; color: #2b6cb0; }
        .hab-estado { font-size: .68rem; color: #2f855a; }
        .no-disponible .hab-estado { color: #c53030; }
        #r-detalle-habitacion { margin-top: .6rem; font-size: .82rem; color: #555; min-height: 1rem; }

        /* ── Formulario ──────────────────────────────────────────────────────── */
        .campo { margin-bottom: .8rem; }

        label {
            display: block;
            font-size: .78rem;
            font-weight: 600;
            color: #444;
            margin-bottom: .25rem;
        }

        select, input[type="date"] {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: .4rem .5rem;
            font-size: .88rem;
        }
        select:focus, input:focus { outline: 2px solid #2b6cb0; }

        .tipo-group { display: flex; gap: 1.2rem; }
        .tipo-group label { display: flex; align-items: center; gap: .3rem; cursor: pointer; }
        .tipo-group input { width: auto; }

        /* ── Botones ─────────────────────────────────────────────────────────── */
        .btn-group { display: flex; gap: .5rem; margin-top: .9rem; }
        button {
            flex: 1;
            padding: .55rem .8rem;
            border: none;
            border-radius: 4px;
            font-size: .88rem;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { opacity: .85; }
        .btn-preview   { background: #d69e2e; color: #fff; }
        .btn-confirm   { background: #2b6cb0; color: #fff; }
        .btn-historial { background: #276749; color: #fff; margin-top: .5rem; width: 100%; }

        /* ── Comprobante ─────────────────────────────────────────────────────── */
        .resultado-box {
            margin-top: 1rem;
            border: 1px solid #bee3f8;
            border-radius: 4px;
            padding: .8rem;
            background: #f7fafc;
            font-size: .82rem;
        }
        .resultado-box h3 { font-size: .88rem; color: #1a365d; margin-bottom: .6rem; }
        .comp-tabla { width: 100%; border-collapse: collapse; }
        .comp-tabla th, .comp-tabla td { padding: .25rem .35rem; text-align: left; }
        .comp-tabla th  { color: #666; width: 110px; }
        .descuento { color: #c53030; font-weight: 600; }
        .total     { color: #2b6cb0; font-weight: 700; }
        .beneficios { padding-left: 1rem; color: #276749; margin-top: .3rem; }
        .aviso { color: #c05621; margin-top: .4rem; font-style: italic; font-size: .76rem; }

        /* ── Badges ──────────────────────────────────────────────────────────── */
        .badge { font-size: .68rem; padding: .1rem .4rem; border-radius: 10px; font-weight: 700; vertical-align: middle; }
        .badge.vip { background: #fefcbf; color: #744210; border: 1px solid #d69e2e; }
        .badge.std { background: #c6f6d5; color: #276749; border: 1px solid #48bb78; }

        /* ── Historial ───────────────────────────────────────────────────────── */
        .seccion-historial { margin-top: 1rem; grid-column: 1 / -1; }
        .tabla-historial { width: 100%; border-collapse: collapse; font-size: .82rem; }
        .tabla-historial th { background: #1a365d; color: #fff; padding: .4rem .6rem; text-align: left; }
        .tabla-historial td { padding: .4rem .6rem; border-bottom: 1px solid #e2e8f0; }
        .tabla-historial tr:hover td { background: #f0f6ff; }

        .oculto { display: none !important; }
    </style>
</head>
<body>

<header>
    <h1>Reservas de Hotel</h1>
    <a class="nav-link" href="VistaAmenidades.html">Ir a Amenidades Extras →</a>
</header>

<main>

    <div>
        <section>
            <h2>Habitaciones disponibles</h2>
            <div id="r-grid-habitaciones"><p>Cargando...</p></div>
            <p id="r-detalle-habitacion"></p>
        </section>

        <section id="r-seccion-historial" class="seccion-historial oculto">
            <h2>Historial de reservas</h2>
            <table class="tabla-historial">
                <thead>
                    <tr>
                        <th>#</th><th>Cliente</th><th>Hab.</th>
                        <th>Tipo</th><th>Ingreso</th><th>Salida</th><th>Total</th>
                    </tr>
                </thead>
                <tbody id="r-historial-body">
                    <tr><td colspan="7">-</td></tr>
                </tbody>
            </table>
        </section>
    </div>

    <div>
        <section>
            <h2>Nueva reserva</h2>

            <div class="campo">
                <label for="r-clienteId">Cliente</label>
                <select id="r-clienteId">
                    <option value="">Cargando...</option>
                </select>
            </div>

            <div class="campo">
                <label for="r-fechaIngreso">Fecha de ingreso</label>
                <input type="date" id="r-fechaIngreso">
            </div>

            <div class="campo">
                <label for="r-fechaSalida">Fecha de salida</label>
                <input type="date" id="r-fechaSalida">
            </div>

            <div class="campo">
                <label>Tipo de reserva</label>
                <div class="tipo-group">
                    <label><input type="radio" name="r-tipo" value="estandar" checked> Estandar (5% dto.)</label>
                    <label><input type="radio" name="r-tipo" value="vip"> VIP (20% dto.)</label>
                </div>
            </div>

            <div class="campo">
                <label for="r-metodoPago">Metodo de pago</label>
                <select id="r-metodoPago">
                    <option value="efectivo">Efectivo</option>
                    <option value="tarjeta">Tarjeta de credito</option>
                    <option value="transferencia">Transferencia bancaria</option>
                </select>
            </div>

            <div class="btn-group">
                <button class="btn-preview" id="r-btnPreview">Vista previa</button>
                <button class="btn-confirm" id="r-btnConfirmar">Confirmar</button>
            </div>

            <button class="btn-historial" id="r-btnHistorial">Ver historial</button>

            <div id="r-comprobante" class="resultado-box oculto"></div>
        </section>
    </div>

</main>

<script>
// ── Reservas (Template Method) ────────────────────────────────────────────────
class VistaReservas {
    constructor() {
        this.API = 'http://localhost:9000/api/index.php';
        this.habitaciones = [];
        this.habitacionSeleccionada = null;
        this.tipoReserva = 'estandar';
        this.reservaController = null;

        this._init();
    }

    _init() {
        this._cargarHabitaciones();
        this._cargarClientes();
        this._bindEventos();
    }

    async _cargarHabitaciones() {
        const data = await this._fetch({ action: 'listar_habitaciones' });
        this.habitaciones = data ?? [];
        this._renderHabitaciones();
    }

    async _cargarClientes() {
        const data = await this._fetch({ action: 'listar_clientes' });
        const select = document.getElementById('r-clienteId');
        select.innerHTML = '<option value="">-- Seleccionar cliente --</option>';
        (data ?? []).forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.nombre} (${c.correo})`;
            select.appendChild(opt);
        });
    }

    _seleccionarHabitacion(id) {
        this.habitacionSeleccionada = this.habitaciones.find(h => h.id == id);
        document.querySelectorAll('.hab-card').forEach(el => el.classList.remove('seleccionada'));
        document.getElementById(`hab-${id}`)?.classList.add('seleccionada');

        if (this.habitacionSeleccionada) {
            document.getElementById('r-detalle-habitacion').textContent =
                `Hab. ${this.habitacionSeleccionada.numero} - ${this.habitacionSeleccionada.tipo} - Bs ${this.habitacionSeleccionada.precio_noche}/noche`;

            const tipo = this.habitacionSeleccionada.tipo ?? 'estandar';
            const radio = document.querySelector(`input[name="r-tipo"][value="${tipo}"]`);
            if (radio) { radio.checked = true; this.tipoReserva = tipo; }
        }
    }

    async _calcular() {
        if (!this._validar()) return;
        this._cancelar();
        this.reservaController = new AbortController();
        const data = await this._fetch(this._payload(true), this.reservaController.signal);
        if (data) this._renderComprobante(data, true);
    }

    async _confirmar() {
        if (!this._validar()) return;
        this._cancelar();
        this.reservaController = new AbortController();
        const data = await this._fetch(this._payload(false), this.reservaController.signal);
        if (data) {
            this._renderComprobante(data, false);
            await this._cargarHabitaciones();
        }
    }

    _renderComprobante(data, esPreview) {
        const badge = data.tipo === 'VIP'
            ? '<span class="badge vip">VIP</span>'
            : '<span class="badge std">Estandar</span>';
        const beneficiosHtml = data.beneficios.map(b => `<li>${b}</li>`).join('');

        const box = document.getElementById('r-comprobante');
        box.innerHTML = `
            <h3>${esPreview ? 'Vista previa' : 'Reserva confirmada'} ${badge}</h3>
            <table class="comp-tabla">
                <tr><th>Cliente</th>     <td>${data.cliente}</td></tr>
                <tr><th>Habitacion</th>  <td>${data.habitacion} (${data.tipo_hab})</td></tr>
                <tr><th>Ingreso</th>     <td>${data.ingreso}</td></tr>
                <tr><th>Salida</th>      <td>${data.salida}</td></tr>
                <tr><th>Precio base</th> <td>Bs ${data.precioBase.toFixed(2)}</td></tr>
                <tr><th>Descuento</th>   <td class="descuento">- Bs ${data.descuento.toFixed(2)}</td></tr>
                <tr><th>Total</th>       <td class="total">Bs ${data.precioFinal.toFixed(2)}</td></tr>
            </table>
            <p><strong>Beneficios:</strong></p>
            <ul class="beneficios">${beneficiosHtml}</ul>
            ${esPreview ? '<p class="aviso">Vista previa - presiona Confirmar para guardar.</p>' : ''}
        `;
        box.classList.remove('oculto');
        box.scrollIntoView({ behavior: 'smooth' });
    }

    async _renderHistorial() {
        const data = await this._fetch({ action: 'historial' });
        const filas = data ?? [];
        const tbody = document.getElementById('r-historial-body');
        tbody.innerHTML = filas.length
            ? filas.map(r => `
                <tr>
                    <td>${r.id}</td>
                    <td>${r.cliente_nombre}</td>
                    <td>${r.habitacion_numero}</td>
                    <td>${r.tipo}</td>
                    <td>${r.fecha_ingreso}</td>
                    <td>${r.fecha_salida}</td>
                    <td>Bs ${parseFloat(r.precio_final).toFixed(2)}</td>
                </tr>`).join('')
            : '<tr><td colspan="7">Sin reservas registradas.</td></tr>';
        document.getElementById('r-seccion-historial').classList.remove('oculto');
    }

    _renderHabitaciones() {
        document.getElementById('r-grid-habitaciones').innerHTML =
            this.habitaciones.map(h => `
                <div id="hab-${h.id}" class="hab-card ${+h.disponible ? '' : 'no-disponible'}" data-id="${h.id}">
                    <span class="hab-num">${h.numero}</span>
                    <span class="hab-tipo">${h.tipo}</span>
                    <span class="hab-precio">Bs ${parseFloat(h.precio_noche).toFixed(2)}/noche</span>
                    <span class="hab-estado">${+h.disponible ? 'Disponible' : 'Ocupada'}</span>
                </div>`).join('');
    }

    _payload(preview) {
        return {
            action:       preview ? 'calcular' : 'reservar',
            tipo:         this.tipoReserva,
            clienteId:    document.getElementById('r-clienteId').value,
            habitacionId: this.habitacionSeleccionada?.id,
            fechaIngreso: document.getElementById('r-fechaIngreso').value,
            fechaSalida:  document.getElementById('r-fechaSalida').value,
            metodoPago:   document.getElementById('r-metodoPago').value,
        };
    }

    _validar() {
        if (!this.habitacionSeleccionada)                         { alert('Selecciona una habitacion.');              return false; }
        if (!document.getElementById('r-clienteId').value)        { alert('Selecciona un cliente.');                  return false; }
        if (!document.getElementById('r-fechaIngreso').value ||
            !document.getElementById('r-fechaSalida').value)      { alert('Ingresa las fechas de ingreso y salida.'); return false; }
        return true;
    }

    _cancelar() {
        if (this.reservaController) this.reservaController.abort();
    }

    _bindEventos() {
        document.getElementById('r-btnPreview')  .addEventListener('click', () => this._calcular());
        document.getElementById('r-btnConfirmar').addEventListener('click', () => this._confirmar());
        document.getElementById('r-btnHistorial').addEventListener('click', () => this._renderHistorial());

        document.querySelectorAll('input[name="r-tipo"]').forEach(r =>
            r.addEventListener('change', e => { this.tipoReserva = e.target.value; })
        );

        document.getElementById('r-grid-habitaciones').addEventListener('click', e => {
            const card = e.target.closest('.hab-card');
            if (card && !card.classList.contains('no-disponible')) {
                this._seleccionarHabitacion(card.dataset.id);
            }
        });
    }

    async _fetch(payload, signal = null) {
        try {
            const res  = await fetch(this.API, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify(payload),
                signal,
            });
            const json = await res.json();
            if (!json.ok) { alert(`Error: ${json.error}`); return null; }
            return json.data;
        } catch (e) {
            if (e.name !== 'AbortError') alert(`Error de red: ${e.message}`);
            return null;
        }
    }
}

document.addEventListener('DOMContentLoaded', () => new VistaReservas());
</script>
</body>
</html>
